const CURS={MUR:'Rs ',KES:'KSh ',USD:'$',EUR:'€',GBP:'£',ZAR:'R ',NGN:'₦',TZS:'TSh ',UGX:'USh ',RWF:'RF ',GHS:'GH₵',INR:'₹',AED:'AED ',CNY:'CN¥',JPY:'JP¥',AUD:'A$',CAD:'C$',CHF:'CHF '},ZERO=['UGX','RWF','JPY'];

const sumBy=l=>{const m={};l.forEach(o=>{const c=oc(o);m[c]=(m[c]||0)+ot(o)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const mmH=a=>(a.length?a:[['MUR',0]]).map(x=>`<div>${money(x[1],x[0])}</div>`).join(''),mmT=a=>(a.length?a:[['MUR',0]]).map(x=>money(x[1],x[0])).join(' · ');
const gr=(c,p)=>p>0?`<div class="gr ${c>=p?'up':'dn'}">${c>=p?'↑':'↓'} ${Math.abs(Math.round((c-p)/p*100))}%</div>`:(c>0?'<div class="gr up">New</div>':'<div class="gr">&nbsp;</div>');

function barSvg(vals,labs,c){const W=600,H=190,L=40,B=22,T=8,mx=Math.max(1,...vals),bw=(W-L)/vals.length;
const grid=[0,.25,.5,.75,1].map(f=>{const y=T+(H-B-T)*(1-f);return `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--bd)"/><text x="${L-4}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--mut)">${kfmt(mx*f)}</text>`}).join('');
const bars=vals.map((v,i)=>{const h=(H-B-T)*v/mx;return `<rect x="${L+i*bw+bw*.15}" y="${H-B-h}" width="${bw*.7}" height="${v>0?Math.max(h,2):0}" rx="2" style="fill:var(--acc)"/>`}).join('');
const xl=labs.map((t,i)=>t?`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${t}</text>`:'').join('');
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of sales in ${esc(c||'')}, total ${money(vals.reduce((a,b)=>a+b,0),c)}" style="width:100%;height:auto">${grid}${bars}${xl}</svg>`}
function lineSvg(series,labs){const W=520,H=210,L=40,B=24,T=10,mx=Math.max(4,...series.flatMap(s=>s.v)),X=i=>L+(W-L-10)*i/Math.max(1,labs.length-1),Y=v=>T+(H-B-T)*(1-v/mx);
const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" style="stroke:var(--bd)"/><text x="${L-4}" y="${Y(mx*f)+4}" text-anchor="end" font-size="10" style="fill:var(--mut)">${kfmt(mx*f)}</text>`).join('');
const ln=series.map(s=>`<polyline fill="none" style="stroke:${s.c}" stroke-width="2.5" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" style="fill:${s.c}"/>`).join('')}`).join('');
const xl=labs.map((t,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${t}</text>`).join('');
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth chart: ${series.map(s=>s.n+' now '+s.v[s.v.length-1]).join(', ')}" style="width:100%;height:auto">${grid}${ln}${xl}</svg>`}
function donutSvg(parts){const tot=parts.reduce((a,p)=>a+p.v,0),R=36,C=2*Math.PI*R;let off=0;
const arcs=tot?parts.map(p=>{const len=C*p.v/tot,e=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=len;return e}).join(''):`<circle cx="50" cy="50" r="${R}" fill="none" style="stroke:var(--chip)" stroke-width="16"/>`;
return `<svg viewBox="0 0 100 100" role="img" aria-label="Inventory status chart" style="width:130px;height:130px;flex:0 0 130px">${arcs}</svg>`}
function reportOne(os,title,c){

const unpaid=os.filter(o=>!o.paid&&['Accepted','Pending','Completed'].includes(o.st)),best={};

const days=[...Array(7)].map((_,i)=>sum(done.filter(o=>new Date(o.at).toDateString()==new Date(now-(6-i)*864e5).toDateString()))),lb=[...Array(7)].map((_,i)=>new Date(now-(6-i)*864e5).toLocaleDateString([],{weekday:'short'}));

if(a=='dec'&&o.stk){u.stk=false;const p=D_('products',o.pid);if(p&&tr(p))b.update(doc(db,'products',p.id),{stock:increment(oq(o))})}
b.update(doc(db,'orders',v),u);await b.commit();aud('Order '+st.toLowerCase(),o.name+' - '+o.pname)}
else if(a=='paid'){const o=D_('orders',v);if(!o.paid){await updateDoc(doc(db,'orders',v),{paid:true,paidAt:Date.now()});aud('Marked paid',o.name+' - '+o.pname)}}
else if(a=='unpay'){const o=D_('orders',v);await updateDoc(doc(db,'orders',v),{paid:false,paidAt:null});aud('Undid paid (admin)',o.name+' - '+o.pname)}
else if(a=='setstock'){const t=el.value.trim(),n=t===''?null:Math.max(0,parseInt(t)||0),p=D_('products',v),b=writeBatch(db);b.update(doc(db,'products',v),{stock:n});
if(n>0&&tr(p)&&p.stock<=0)D.orders.filter(o=>o.pid==v&&o.st=='Scheduled').forEach(o=>b.update(doc(db,'orders',o.id),{st:'Placed',at:Date.now()}));await b.commit()}
else if(a=='rcpt'){const o=[...D.orders,...D.mine].find(x=>x.id==v);if(o&&o.paid&&!['Cancelled','Declined'].includes(o.st))rcId=v;else err='A receipt is only available after the seller confirms payment.'}
else if(a=='rcx')rcId=null;
else if(a=='print')window.print();
else if(a=='rcshare'){const o=[...D.orders,...D.mine].find(x=>x.id==rcId),t='Receipt '+short(o)+'\n'+o.pname+' x'+oq(o)+' = '+mo(ot(o),o)+'\n'+(o.paid?'PAID':'UNPAID')+'\nCampus Market';try{if(navigator.share)await navigator.share({title:'Receipt',text:t});else{await navigator.clipboard.writeText(t);msg='Receipt text copied.'}}catch(e){}}
else if(a=='bk'||a=='bkcsv'){const dl=(n,ty,tx)=>{const u=URL.createObjectURL(new Blob([tx],{type:ty})),l=document.createElement('a');l.href=u;l.download=n;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)},d=new Date().toISOString().slice(0,10);
if(a=='bk')dl('campus-market-backup-'+d+'.json','application/json',JSON.stringify({exported:Date.now(),sellers:D.sellers,products:D.products.map(p=>({...p,img:p.img?'[photo]':''})),orders:D.orders,users:D.users,recs:D.recs,audit:D.audit},null,1));
else{const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';dl('orders-'+d+'.csv','text/csv',['Receipt,Date,Shop,Customer,Item,Qty,Currency,Unit price,Total,Status,Paid,Delivery spot'].concat(D.orders.map(o=>[short(o),new Date(o.at).toISOString(),sn(o.sid),o.name,o.pname,oq(o),oc(o),op(o),ot(o),o.st,o.paid?'Yes':'No',o.spot].map(q).join(','))).join('\n'))}
aud('Downloaded '+(a=='bk'?'backup':'orders CSV'))}
else if(a=='sold'){const p=D_('products',v);if(el.checked)await updateDoc(doc(db,'products',v),{sold:true});else await restock(p)}
else if(a=='back')await updateDoc(doc(db,'products',v),{back:el.value});
else if(a=='stock')await restock(D_('products',v));
else if(a=='add'){const n=$('#np').value.trim(),pr=parseFloat($('#npr').value);if(n&&pr>=0){const f=$('#npi').files[0];await addDoc(collection(db,'products'),{sid:P.sid,name:n,cat:$('#nc').value,price:pr,sold:false,back:'',img:f?await shrink(f):'',desc:$('#npd').value.trim().slice(0,300),at:Date.now(),was:(()=>{const w=parseFloat($('#npw').value);return w>pr&&w<=pr*5?w:0})(),stock:(()=>{const t=$('#nst').value.trim();return t===''?null:Math.max(0,parseInt(t)||0)})()})}}
else if(a=='savewa'){const w=num($('#mw').value);if(w.length<8||w.length>15)err='Please type a WhatsApp number with country code.';else await updateDoc(doc(db,'sellers',P.sid),{wa:w})}
else if(a=='pic'){const f=el.files[0];if(f)await updateDoc(doc(db,'products',v),{img:await shrink(f)})}
else if(a=='appr'){const s=D_('sellers',v),b=writeBatch(db);b.update(doc(db,'sellers',v),{ok:true,okAt:Date.now()});b.update(doc(db,'users',s.owner),{role:'seller',sid:v});await b.commit();aud('Approved seller',s.name)}
else if(a=='rej'){const s=D_('sellers',v);await deleteDoc(doc(db,'sellers',v));aud('Rejected seller',s?.name)}
else if(a=='del'){const p=D_('products',v);await deleteDoc(doc(db,'products',v));aud('Removed product',(p?.name||'')+' ('+sn(p?.sid)+')')}
}catch(e){err=nice(e);console.error(e)}
render()}
async function restock(p){const b=writeBatch(db);b.update(doc(db,'products',p.id),{sold:false,back:''});
D.orders.filter(o=>o.pid==p.id&&o.st=='Scheduled').forEach(o=>b.update(doc(db,'orders',o.id),{st:'Placed',at:Date.now()}));await b.commit()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.matches('input,select,textarea'))act(b.dataset.a,b.dataset.v)});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.a&&b.matches('input,select,textarea')){b.blur();act(b.dataset.a,b.dataset.v,b)}});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const box=document.getElementById('inst');let ev=null;
const stand=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const hid=()=>{try{return Date.now()-(+localStorage.getItem('cmInstX')||0)<6048e5}catch(e){return false}};
const hide=()=>box.classList.remove('on');
function show(){if(stand()||hid())return;
if(ev)box.innerHTML='<div class="ir"><img src="icon-192.png" alt=""><div class="it"><b>Install Campus Market</b>Open it like a real app, full screen.</div><button class="btn" id="instgo">Install</button><button class="x" id="instx" aria-label="Not now">×</button></div>';
else if(ios)box.innerHTML='<div class="ir"><img src="icon-192.png" alt=""><div class="it"><b>Install Campus Market</b>Tap the Share button, then Add to Home Screen.</div><button class="x" id="instx" aria-label="Not now">×</button></div>';
else return;
box.classList.add('on');
const g=document.getElementById('instgo');if(g)g.onclick=async()=>{try{ev.prompt();await ev.userChoice}catch(e){}ev=null;hide()};
document.getElementById('instx').onclick=()=>{try{localStorage.setItem('cmInstX',String(Date.now()))}catch(e){}hide()}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;show()});
window.addEventListener('appinstalled',()=>{ev=null;hide()});
if(ios)setTimeout(show,2500)})();

document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='mt'){e.preventDefault();act('send')}if(e.key=='Enter'&&e.target.id=='sq'){e.preventDefault();act('search')}});
setInterval(()=>{if(U&&P)soft()},60000);
</script>
