<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Market</title>
<style>
:root{--bg:#FFF6E9;--card:#fff;--ink:#2B1B12;--mut:#6B5646;--acc:#C2410C;--accink:#fff;--line:#A58A74;--red:#B3261E;--redink:#fff;--redbg:#FDECEA;--chip:#FBE4CC;--input:#fff;--bd:#F0DFC8;--on:#2B1B12;--onink:#FFF6E9;--sbg:#FFE9D2}

:root[data-theme="dark"]{--bg:#120C08;--card:#2A1C13;--ink:#FBEFE2;--mut:#CDB9A5;--acc:#FB923C;--accink:#2B1204;--line:#8C6F57;--red:#FF8A80;--redink:#3A1E1E;--redbg:#3A1E1E;--chip:#3D2A1D;--input:#1A110B;--bd:#4A3426;--on:#6B4A32;--onink:#FBEFE2;--sbg:#2E1D11}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.ok{outline:1px solid var(--acc)}.lateb{background:var(--redbg);outline:1px solid var(--red)}

.card{overflow:hidden;display:flex;flex-direction:column}
.ph{height:84px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;background:var(--chip);color:#2B1B12}
.b{padding:10px;display:flex;flex-direction:column;gap:4px}
.n,.t,.h{font-weight:700}.n,.t{font-size:14px}.h{font-size:16px}.p{font-weight:700;margin-bottom:4px}
.s{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--card);color:var(--ink);font-size:14px;font-weight:600}

.btn.no{background:var(--card);color:var(--red);border:1px solid var(--red)}

.tag.late{background:var(--red);color:var(--redink)}
.stat{flex:1;padding:10px;text-align:center}.num{font-size:24px;font-weight:800}
label{font-size:12px;font-weight:600}
input,select{min-height:44px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;background:var(--input);color:var(--ink);width:100%}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap}.chk input{width:22px;min-height:22px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;min-height:44px}
a{color:var(--acc);font-weight:700}
.gp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 12px}
.gp summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.gpl{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}.gp .box{background:var(--bg)}
.dr{display:flex;flex-direction:column;gap:6px}.dr h2{margin:0;font-size:18px}
.hr{display:flex;gap:12px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;touch-action:pan-x pan-y}.hr::-webkit-scrollbar{display:none}
.bc{flex:0 0 200px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}

.box .chip{background:var(--chip)}.box .chip[aria-pressed="true"]{background:var(--on);color:var(--onink)}
.pv{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.stu{background:var(--sbg);border:1px solid var(--bd);border-radius:18px;padding:14px 0 14px 14px;display:flex;flex-direction:column;gap:10px}
.stu .row{padding-right:14px}.stu h2{margin:0;font-size:19px}
.sm{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x pan-y;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.sm::-webkit-scrollbar{display:none}
.trk{display:flex;gap:12px;width:max-content;padding:2px 0}
.scard{display:flex;flex-direction:column;gap:2px;flex:0 0 150px;width:150px;padding:0 0 10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--ink);font:inherit;text-align:left;overflow:hidden;cursor:pointer;transition:transform .2s}
.scard:hover{transform:translateY(-2px)}
.simg{display:flex;align-items:center;justify-content:center;height:130px;font-size:32px;font-weight:800;color:#2B1B12}
.simg img{width:100%;height:100%;object-fit:cover}
.sn,.ss{padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn{padding-top:8px;font-weight:700;font-size:14px}.sp{padding:0 10px;font-weight:700}
.ss{font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.scard{transition:none}.scard:hover{transform:none}}.er{color:var(--red);font-size:13px}
</style>
</head>

const app=initializeApp({apiKey:"AIzaSyB6S7bCoAbVVgkFYW0gBahBmBynvoWpIrw",authDomain:"campus-market-290b9.firebaseapp.com",projectId:"campus-market-290b9",storageBucket:"campus-market-290b9.firebasestorage.app",messagingSenderId:"529660883069",appId:"1:529660883069:web:fd8e5c2a9f0e7c1e688114"});

const wk=()=>'cmW_'+(P.sid||''),welcomed=()=>{try{return localStorage.getItem(wk())=='1'}catch(e){return false}};

return `<div class="box ok" role="status"><div class="h">Congratulations, ${esc(P.name)}! You are approved.</div><div class="s">${esc(sn(P.sid))} is now live on Campus Market. Here is what you can do:</div><ul class="pv"><li>Add products with photos and prices</li><li>Receive orders and accept or decline them</li><li>Mark items sold out, and set a restock date so buyers can pre-order</li><li>${st?'Get featured in the Student Marketplace at the top of the page':'Be listed with the businesses on the Browse page'}</li><li>Get help from the admin if an order waits too long</li></ul><div class="s">Tip: in My shop, add your WhatsApp number and the areas you deliver to, so buyers can find and reach you.</div><button class="btn" data-a="wel">Let’s start</button></div>`}

const kd=id=>D.sellers.find(s=>s.id==id)?.kind=='student'?'student':'business';

L(query(o,where('buyer','==',U.uid)),'mine');

const r=doc(db,'users',u.uid);
try{const s=await getDoc(r);if(!s.exists())await setDoc(r,{name:pend||(u.email||'').split('@')[0],role:'buyer',email:u.email});else if(!s.data()?.email&&u.email)await updateDoc(r,{email:u.email})}catch(e){err=nice(e)}

function authV(){return `<div class="box"><div class="chips"><button class="chip" aria-pressed="${mode=='in'}" data-a="mode" data-v="in">Sign in</button><button class="chip" aria-pressed="${mode=='up'}" data-a="mode" data-v="up">Create account</button></div>${mode=='up'?'<label for="an">First name</label><input id="an" autocomplete="given-name">':''}<label for="ae">Email</label><input id="ae" type="email" autocomplete="email"><label for="ap">Password (6 or more characters)</label><input id="ap" type="password" autocomplete="${mode=='in'?'current-password':'new-password'}">${mode=='up'?'<div class="s">Your email is visible to the admin. Your WhatsApp number is visible to the admin and to shops you order from.</div>':''}<button class="btn" data-a="auth">${mode=='in'?'Sign in':'Create account'}</button>${err?`<div class="er">${esc(err)}</div>`:''}</div>`}

function stu(){
const ok=new Set(D.sellers.filter(s=>s.ok).map(s=>s.id));
const ps=D.products.filter(p=>ok.has(p.sid)&&kd(p.sid)=='student'&&!(p.sold&&!p.back));

const loop=ps.length>=3&&!matchMedia('(prefers-reduced-motion: reduce)').matches,k=loop?Math.ceil(1400/(ps.length*162))+3:1;

let pos=0,hold=false,resumeAt=0,lastUser=-1e9,lastSet=0,lastT=0,sync=0;
function initCar(){const el=$('#sm');if(!el)return;
if(el.dataset.loop=='1'){const t=el.firstElementChild,h=t.children[+el.dataset.n].offsetLeft-t.children[0].offsetLeft;el.dataset.half=h;

if(!el||el.dataset.loop!='1'||hold||t<resumeAt||t-lastUser<2500||document.hidden){sync=1;return}

const h=+el.dataset.half;pos+=0.028*dt;if(pos>=2*h)pos-=h;el.scrollLeft=pos;lastSet=el.scrollLeft}
requestAnimationFrame(tick);
const inSm=e=>e.target.closest&&e.target.closest('#sm'),hd=()=>{hold=true},rl=()=>{hold=false;resumeAt=performance.now()+2500};

function discover(){
const ok=new Set(D.sellers.filter(s=>s.ok).map(s=>s.id)),day=Math.floor(Date.now()/864e5),w7=Date.now()-6048e5;

R('For you','Based on what you saved, viewed and ordered',top.length?ps.filter(p=>top.includes(p.cat)&&!seen.has(p.id)).slice(0,10):[]),

const B=(t,sub,l,extra)=>l.length?`<section class="dr"><h2>${t}</h2><div class="s">${sub}</div>${extra||''}<div class="hr">${l.map(bcard).join('')}</div></section>`:'';
const pop=by(okS.filter(x=>D.recs.some(r=>r.sid==x.id)),x=>D.recs.filter(r=>r.sid==x.id).length).slice(0,10);
const bcs=['All',...new Set(ps.map(p=>p.cat))],shops=okS.filter(x=>bcat=='All'||ps.some(p=>p.sid==x.id&&p.cat==bcat)).sort((a,b)=>(mySid.has(a.id)-mySid.has(b.id))||hs(a.id+day)-hs(b.id+day));
const bch=`<div class="chips">${bcs.map(c=>`<button class="chip" aria-pressed="${c==bcat}" data-a="bcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
const shopH=B('Popular shops','Shops with the most student recommendations',pop)+B('Explore shops','Shops you have not tried come first',shops,bch);
const picker=areas.length?`<label for="ar">Your area</label><select id="ar" data-a="area"><option value="">Anywhere</option>${areas.map(a=>`<option${a==area?' selected':''}>${esc(a)}</option>`).join('')}</select>`:'';
return `<div class="s">Find something new from sellers around you.</div>${picker}${ordBox()}${sec||shopH?sec+shopH:'<div class="box"><div class="t">Nothing to discover yet.</div><div class="s">Check back soon, or open Browse to see everything.</div></div>'}`}
function browse(){
const ok=new Set(D.sellers.filter(s=>s.ok).map(s=>s.id)),ps=D.products.filter(p=>ok.has(p.sid)),cats=['All',...new Set(ps.map(p=>p.cat))];
let h=stu()+`<div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="chips">${[['All','All sellers'],['business','Businesses'],['student','Student items']].map(t=>`<button class="chip" aria-pressed="${t[0]==ty}" data-a="ty" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
h+=ordBox();
h+=`<div class="grid">${ps.filter(p=>(cat=='All'||p.cat==cat)&&(ty=='All'||kd(p.sid)==ty)).map(p=>{const b=p.sold&&!p.back?'<span class="btn off">Sold out</span>':`<button class="btn" data-a="ord" data-v="${p.id}">${p.sold?'Pre-order (back '+esc(p.back)+')':'Order'}</button>`;return `<div class="card"><div class="ph" style="background:${tint(p.name)}">${String(p.img||'').startsWith('data:image/')?`<img src="${esc(p.img)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover">`:esc(p.name[0])}</div><div class="b"><div class="n">${esc(p.name)}</div><div class="s">${esc(sn(p.sid))} · ${kd(p.sid)=='student'?'Student':'Business'}</div><div class="p">${priceH(p)}</div>${b}</div></div>`}).join('')}</div>`;
const my=[...D.mine].sort(byNew);
if(my.length)h+='<h2>My orders</h2>'+my.map(o=>{const open=!['Completed','Cancelled','Declined'].includes(o.st);return `<div class="box"><div class="row"><div class="t">${esc(o.pname)}</div>${tag(o)}</div><div class="s">${fmt(o.at)} · ${esc(o.spot)}</div>${o.why?`<div class="s">Reason: ${esc(o.why)}</div>`:''}${open?`<div class="row"><select id="r${o.id}" aria-label="Cancel reason"><option>Changed my mind</option><option>Wrong item</option><option>Seller too slow</option></select><button class="btn no" data-a="cx" data-v="${o.id}">Cancel</button></div>`:''}</div>`}).join('');
if(P.role=='buyer'){const m=D.sellers.find(s=>s.owner==U.uid);h+=m?`<div class="box ok"><div class="h">Thanks for applying!</div><div class="s">Your shop <b>${esc(m.name)}</b> is being reviewed. Once the admin approves it, you will see a welcome message here.</div></div>`:`<div class="box"><div class="h">Want to sell?</div><div class="s">Run a business or just have items to sell? Both are welcome.</div><label for="sb">Shop name (or just your own name)</label><input id="sb" value="${esc(ap.n||'')}"><label for="sk">I am a</label><select id="sk"><option value="business">Business</option><option value="student"${ap.k=='student'?' selected':''}>Student selling my own items</option></select><label for="sw">WhatsApp number (with country code, e.g. 23057123456)</label><input id="sw" inputmode="tel" value="${esc(ap.w||'')}"><button class="btn" data-a="apply">Apply to sell</button></div>`}
return h}

function seller(){
const ps=D.products.filter(p=>p.sid==P.sid),os=[...D.orders].sort(byNew);
let h=`<div class="h">${esc(sn(P.sid))}</div><div class="box"><label for="mw">Your WhatsApp number (with country code)</label><input id="mw" inputmode="tel" value="${esc(D.sellers.find(s=>s.id==P.sid)?.wa||'')}"><button class="btn" data-a="savewa">Save number</button><label for="ma">Areas you deliver to (separate with commas, e.g. Block C, Canteen)</label><input id="ma" value="${esc((D.sellers.find(s=>s.id==P.sid)?.areas||[]).join(', '))}"><button class="btn" data-a="savearea">Save areas</button></div><div class="box"><div class="row"><div class="h">New orders</div><div class="num">${os.filter(o=>o.st=='Placed').length}</div></div></div>`;
h+=os.map(o=>{const a={Placed:[['acc','Accept',''],['dec','Decline','no']],Accepted:[['pen','Move to pending','']],Pending:[['com','Complete','']]}[o.st]||[];return `<div class="box${late(o)?' lateb':''}"><div class="row"><div class="t">${esc(o.name)} - ${esc(o.pname)}</div>${tag(o)}</div><div class="s">${esc(o.spot)} · ${fmt(o.at)}</div>${bwl(o)}${o.why?`<div class="s">Reason: ${esc(o.why)}</div>`:''}${o.st=='Scheduled'?'<div class="s">Becomes a real order when you mark the product back in stock.</div>':''}${a.length?`<div class="row">${a.map(x=>`<button class="btn ${x[2]}" style="flex:1" data-a="${x[0]}" data-v="${o.id}">${x[1]}</button>`).join('')}</div>`:''}</div>`}).join('')||'<div class="s">No orders yet.</div>';
h+='<h2>Your products</h2>'+ps.map(p=>`<div class="box"><div class="row"><div class="t">${esc(p.name)} (${Number(p.price).toFixed(2)})</div><label class="chk"><input type="checkbox" data-a="sold" data-v="${p.id}"${p.sold?' checked':''}>Sold out</label></div><label class="s">Original price (clear it to end a sale)<input data-a="was" data-v="${p.id}" inputmode="decimal" value="${p.was||''}"></label><label class="s">Change photo<input type="file" accept="image/*" data-a="pic" data-v="${p.id}"></label>${p.sold?`<div class="row"><input type="date" aria-label="Restock date" value="${esc(p.back)}" data-a="back" data-v="${p.id}"><button class="btn" style="white-space:nowrap" data-a="stock" data-v="${p.id}">Back in stock</button></div>`:''}</div>`).join('');
h+=`<div class="box"><div class="h">Add a product</div><label for="np">Name</label><input id="np"><label for="npr">Price</label><input id="npr" inputmode="decimal"><label for="nc">Category</label><select id="nc"><option>Food</option><option>Crafts</option><option>Clothing</option><option>Books</option><option>Used items</option><option>Other</option></select><label for="npw">Original price (only if this is on sale)</label><input id="npw" inputmode="decimal"><label for="npi">Photo (optional)</label><input id="npi" type="file" accept="image/*"><button class="btn" data-a="add">Add product</button></div>`;
return h}

let gopen=new Set();
function people(){
const us=[...D.users].sort((a,b)=>(a.name||'').localeCompare(b.name||'')),sl=u=>D.sellers.find(x=>x.id==u.sid);
const G=[['Admins',us.filter(u=>u.role=='admin')],['Business sellers',us.filter(u=>u.role=='seller'&&sl(u)?.kind!='student')],['Student sellers',us.filter(u=>u.role=='seller'&&sl(u)?.kind=='student')],['Buyers',us.filter(u=>u.role=='buyer')]];
const row=u=>{const x=sl(u),w=num(x?.wa||u.wa),ap=D.sellers.find(y=>y.owner==u.id&&!y.ok);return `<div class="box"><div class="t">${esc(u.name||'No name')}${x?' · '+esc(x.name):''}${ap?' · applied to sell: '+esc(ap.name):''}</div><div class="s">${u.email?`<a href="mailto:${esc(u.email)}">${esc(u.email)}</a>`:'No email yet (it appears after their next sign-in)'}</div><div class="s">${w?`<a href="https://wa.me/${w}" target="_blank" rel="noopener">WhatsApp +${w}</a>`:'No WhatsApp number yet'}</div></div>`};
return `<h2>People</h2><div class="s">${us.length} people signed up. Tap a group to open it.</div>`+G.map(g=>`<details class="gp" data-g="${g[0]}"${gopen.has(g[0])?' open':''}><summary>${g[0]} (${g[1].length})</summary><div class="gpl">${g[1].map(row).join('')||'<div class="s">None yet</div>'}</div></details>`).join('')}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g){d.open?gopen.add(d.dataset.g):gopen.delete(d.dataset.g)}},true);
function admin(){
const os=D.orders,r=os.filter(o=>Date.now()-o.at<864e5),L=os.filter(late).length,pend=D.sellers.filter(s=>!s.ok);
let h=`<div class="row">${[['Orders',r.length],['Accepted',r.filter(o=>['Accepted','Pending','Completed'].includes(o.st)).length],['Declined',r.filter(o=>o.st=='Declined').length]].map(x=>`<div class="stat"><div class="num">${x[1]}</div><div class="s">${x[0]}</div></div>`).join('')}</div><div class="s">Last 24 hours, all businesses</div>`;
h+=`<div class="box${L?' lateb':''}"><div class="row"><div class="h">Needs attention</div><div class="num">${L}</div></div><div class="s">Orders still at Placed after one day</div></div>`;
if(pend.length)h+='<h2>Sellers waiting for approval</h2>'+pend.map(s=>`<div class="box"><div class="t">${esc(s.name)}</div><div class="s">${s.kind=='student'?'Student selling own items':'Business'} · ${s.wa?'+'+esc(s.wa):'no number'}</div><div class="row"><button class="btn" style="flex:1" data-a="appr" data-v="${s.id}">Approve</button><button class="btn no" style="flex:1" data-a="rej" data-v="${s.id}">Reject</button></div></div>`).join('');
h+='<h2>Orders by business</h2>';
D.sellers.filter(s=>s.ok).forEach(s=>{const l=os.filter(o=>o.sid==s.id).sort(byNew);h+=`<div class="t">${esc(s.name)}</div>`+(l.map(o=>`<div class="box${late(o)?' lateb':''}"><div class="row"><div class="t">${esc(o.name)} - ${esc(o.pname)}</div>${tag(o)}</div><div class="s">${fmt(o.at)}${o.why?' · '+esc(o.why):''}</div>${bwl(o)}</div>`).join('')||'<div class="s">No orders</div>')});
h+=people()+'<h2>All products</h2>'+D.products.map(p=>`<div class="box"><div class="row"><div><div class="t">${esc(p.name)}</div><div class="s">${esc(sn(p.sid))}</div></div><button class="btn no" data-a="del" data-v="${p.id}">Remove</button></div></div>`).join('');
return h}

function render(){let h;
if(!hdone&&P&&D.products.length){hdone=1;const m=location.hash.match(/^#p-(.+)$/),p=m&&D.products.find(x=>x.id==m[1]);if(p){ord=p.id;view='discover'}}
if(!U||!P)h=`<div class="row"><h1>Campus Market</h1><button class="link" data-a="theme">${dark()?'Light mode':'Dark mode'}</button></div>`+(U?'<div class="s">Loading...</div>':authV());
else{const tabs=[['discover','Discover'],['browse','Browse'],...(P.role=='seller'?[['seller','My shop']]:[]),...(P.role=='admin'?[['admin','Admin']]:[])];
if(!tabs.some(t=>t[0]==view))view='browse';
h=`<div class="row"><h1>Campus Market</h1><button class="link" data-a="out">Sign out</button></div><div class="row"><div class="s">Hi ${esc(P.name)} (${P.role})</div><button class="link" data-a="theme">${dark()?'Light mode':'Dark mode'}</button></div>`+welcome()+(tabs.length>1?`<div class="chips">${tabs.map(t=>`<button class="chip" aria-pressed="${t[0]==view}" data-a="view" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`:'')+({discover,browse,seller,admin}[view])()+(err?`<div class="er">${esc(err)}</div>`:'')}
const old=$('#sm');pos=old?old.scrollLeft:0;$('#app').innerHTML=h;initCar()}

function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.7))};i.onerror=()=>no(new Error('image'));i.src=u})}
async function act(a,v,el){err='';const D_=(k,i)=>D[k].find(x=>x.id==i);
try{
if(a=='mode'){mode=v;err=''}
else if(a=='auth'){const e=$('#ae').value.trim(),p=$('#ap').value;if(mode=='up'){pend=($('#an').value||'').trim();await createUserWithEmailAndPassword(auth,e,p)}else await signInWithEmailAndPassword(auth,e,p)}
else if(a=='out')await signOut(auth);
else if(a=='view'){view=v;msg=''}
else if(a=='wel'){try{localStorage.setItem(wk(),'1')}catch(e){}view='seller'}
else if(a=='fav'||a=='fol'){const k=a=='fav'?'favs':'follows',cur=k=='favs'?favs():fol();await updateDoc(doc(db,'users',U.uid),{[k]:cur.includes(v)?cur.filter(x=>x!=v):[...cur,v]})}
else if(a=='rec'){const id=U.uid+'_'+v;if(D.recs.some(r=>r.id==id))await deleteDoc(doc(db,'recs',id));else await setDoc(doc(db,'recs',id),{pid:v,sid:D_('products',v).sid,uid:U.uid,at:Date.now()})}
else if(a=='share'){const p=D_('products',v),u=location.origin+location.pathname+'#p-'+v;try{if(navigator.share)await navigator.share({title:'Campus Market',text:p.name,url:u});else{await navigator.clipboard.writeText(u);msg='Link copied. Paste it in WhatsApp to share.'}}catch(e){}}
else if(a=='area'){area=el.value;ss('cmArea',area)}
else if(a=='bcat')bcat=v;
else if(a=='savearea'){const l=$('#ma').value.split(',').map(x=>x.trim().slice(0,30)).filter(Boolean).slice(0,8);await updateDoc(doc(db,'sellers',P.sid),{areas:l})}
else if(a=='was'){const p=D_('products',v),w=parseFloat(el.value);if(!el.value.trim()||w===0)await updateDoc(doc(db,'products',v),{was:0});else if(w>p.price&&w<=p.price*5)await updateDoc(doc(db,'products',v),{was:w});else err='The original price must be higher than the current price, and at most 5 times it.'}
else if(a=='theme'){th=dark()?'light':'dark';try{localStorage.setItem('cmTheme',th)}catch(e){}applyTh()}
else if(a=='cat')cat=v;
else if(a=='ty')ty=v;
else if(a=='ord'){ord=v;msg='';dr={};recent=[v,...recent.filter(x=>x!=v)].slice(0,12);ss('cmRecent',recent);setTimeout(()=>$('#ordp')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}),50)}
else if(a=='no')ord=null;
else if(a=='go'){const n=$('#bn').value.trim(),sp=$('#bs').value.trim(),p=D_('products',ord);dr={n:$('#bn').value,sp:$('#bs').value,w:$('#bw').value};
const w=num($('#bw').value);
if(!n||!sp||w.length<8||w.length>15)msg='Please type your first name, delivery spot and WhatsApp number (with country code).';
else{await addDoc(collection(db,'orders'),{pid:p.id,sid:p.sid,pname:p.name,buyer:U.uid,name:n,spot:sp,at:Date.now(),st:p.sold?'Scheduled':'Placed',why:'',bw:w});await updateDoc(doc(db,'users',U.uid),{wa:w}).catch(()=>{});
msg=`Order sent, thank you ${esc(n)}. <a href="https://wa.me/${num(D_('sellers',p.sid)?.wa)}?text=${encodeURIComponent('Hi, I just ordered '+p.name+' on Campus Market. - '+n)}" target="_blank" rel="noopener">Open WhatsApp to message the seller</a>`;ord=null}}
else if(a=='cx')await updateDoc(doc(db,'orders',v),{st:'Cancelled',why:$('#r'+v).value});
else if(a=='apply'){const n=$('#sb').value.trim(),w=num($('#sw').value);ap={n:$('#sb').value,k:$('#sk').value,w:$('#sw').value};if(!n||w.length<8||w.length>15)err='Please type a name and a WhatsApp number with country code.';else await addDoc(collection(db,'sellers'),{name:n,owner:U.uid,ok:false,kind:$('#sk').value,wa:w})}
else if(['acc','dec','pen','com'].includes(a))await updateDoc(doc(db,'orders',v),{st:{acc:'Accepted',dec:'Declined',pen:'Pending',com:'Completed'}[a]});
else if(a=='sold'){const p=D_('products',v);if(el.checked)await updateDoc(doc(db,'products',v),{sold:true});else await restock(p)}
else if(a=='back')await updateDoc(doc(db,'products',v),{back:el.value});
else if(a=='stock')await restock(D_('products',v));
else if(a=='add'){const n=$('#np').value.trim(),pr=parseFloat($('#npr').value);if(n&&pr>=0){const f=$('#npi').files[0];await addDoc(collection(db,'products'),{sid:P.sid,name:n,cat:$('#nc').value,price:pr,sold:false,back:'',img:f?await shrink(f):'',at:Date.now(),was:(()=>{const w=parseFloat($('#npw').value);return w>pr&&w<=pr*5?w:0})()})}}
else if(a=='savewa'){const w=num($('#mw').value);if(w.length<8||w.length>15)err='Please type a WhatsApp number with country code.';else await updateDoc(doc(db,'sellers',P.sid),{wa:w})}
else if(a=='pic'){const f=el.files[0];if(f)await updateDoc(doc(db,'products',v),{img:await shrink(f)})}
else if(a=='appr'){const s=D_('sellers',v),b=writeBatch(db);b.update(doc(db,'sellers',v),{ok:true});b.update(doc(db,'users',s.owner),{role:'seller',sid:v});await b.commit()}
else if(a=='rej')await deleteDoc(doc(db,'sellers',v));
else if(a=='del')await deleteDoc(doc(db,'products',v));
}catch(e){err=nice(e);console.error(e)}
render()}
async function restock(p){const b=writeBatch(db);b.update(doc(db,'products',p.id),{sold:false,back:''});
D.orders.filter(o=>o.pid==p.id&&o.st=='Scheduled').forEach(o=>b.update(doc(db,'orders',o.id),{st:'Placed',at:Date.now()}));await b.commit()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.matches('input,select'))act(b.dataset.a,b.dataset.v)});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.a&&b.matches('input,select')){b.blur();act(b.dataset.a,b.dataset.v,b)}});
render();
</script>
</body>
</html>
