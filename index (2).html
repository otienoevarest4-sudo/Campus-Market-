function shrink(f,m=480){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.7))};i.onerror=()=>no(new Error('image'));i.src=u})}
async function act(a,v,el){err='';const D_=(k,i)=>D[k].find(x=>x.id==i);
try{

else if(a=='fav'||a=='fol'){const k=a=='fav'?'favs':'follows',cur=k=='favs'?favs():fol();await updateDoc(doc(db,'users',U.uid),{[k]:cur.includes(v)?cur.filter(x=>x!=v):[...cur,v]})}
else if(a=='rec'){const id=U.uid+'_'+v;if(D.recs.some(r=>r.id==id))await deleteDoc(doc(db,'recs',id));else await setDoc(doc(db,'recs',id),{pid:v,sid:D_('products',v).sid,uid:U.uid,at:Date.now()})}
else if(a=='share'){const p=D_('products',v),u=location.origin+location.pathname+'#p-'+v;try{if(navigator.share)await navigator.share({title:'Campus Market',text:p.name,url:u});else{await navigator.clipboard.writeText(u);msg='Link copied. Paste it in WhatsApp to share.'}}catch(e){}}
else if(a=='area'){area=el.value;ss('cmArea',area)}
else if(a=='bcat')bcat=v;
else if(a=='savearea'){const l=$('#ma').value.split(',').map(x=>x.trim().slice(0,30)).filter(Boolean).slice(0,8);await updateDoc(doc(db,'sellers',P.sid),{areas:l})}
else if(a=='was'){const p=D_('products',v),w=parseFloat(el.value);if(!el.value.trim()||w===0)await updateDoc(doc(db,'products',v),{was:0});else if(w>p.price&&w<=p.price*5)await updateDoc(doc(db,'products',v),{was:w});else err='The original price must be higher than the current price, and at most 5 times it.'}
else if(a=='shop'){if(view!='shop')prevView=view;shopId=v;view='shop'}
else if(a=='shopx'){shopId=null;view=prevView||'discover'}
else if(a=='msg'){chat={sid:v,buyer:U.uid};view='msgs'}
else if(a=='chat'){const q=v.split('|');chat={sid:q[0],buyer:q[1]}}
else if(a=='chatx')chat=null;
else if(a=='send'){const t=($('#mt').value||'').trim();if(t&&chat){const now=Date.now(),b=chat.buyer==U.uid;await addDoc(collection(db,'msgs'),{buyer:chat.buyer,sid:chat.sid,from:b?'b':'s',name:b?P.name:sn(chat.sid),text:t.slice(0,500),at:now,exp:now+864e5,expAt:new Date(now+864e5)});$('#mt').value=''}}
else if(a=='nmode'){nmode=el.value;ss('cmNotif',nmode)}
else if(a=='seen'){seen=Date.now();ss('cmSeen',seen)}
else if(a=='allow'){await Notification.requestPermission()}
else if(a=='bio')await updateDoc(doc(db,'sellers',P.sid),{bio:el.value.trim().slice(0,300)});
else if(a=='hours')await updateDoc(doc(db,'sellers',P.sid),{hours:el.value.trim().slice(0,60)});
else if(a=='logo'){const f=el.files[0];if(f)await updateDoc(doc(db,'sellers',P.sid),{logo:await shrink(f,160)})}
else if(a=='plan'){const x=D_('sellers',v),np=x.plan=='pro'?'free':'pro';await updateDoc(doc(db,'sellers',v),{plan:np});aud('Changed plan to '+np,x.name)}
else if(a=='mycsv'){const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';dlFile('my-sales-'+new Date().toISOString().slice(0,10)+'.csv','text/csv',['Receipt,Date,Customer,Item,Qty,Unit price,Total,Status,Paid,Delivery spot'].concat(D.orders.map(o=>[short(o),new Date(o.at).toISOString(),o.name,o.pname,oq(o),op(o),ot(o),o.st,o.paid?'Yes':'No',o.spot].map(q).join(','))).join('\n'))}
else if(a=='theme'){th=dark()?'light':'dark';try{localStorage.setItem('cmTheme',th)}catch(e){}applyTh()}
else if(a=='cat')cat=v;
else if(a=='ty')ty=v;
else if(a=='ord'||a=='ordnow'){if(view=='alerts')view='discover';ord=v;of=a=='ordnow';msg='';dr={};recent=[v,...recent.filter(x=>x!=v)].slice(0,12);ss('cmRecent',recent);setTimeout(()=>$('#ordp')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}),50)}
else if(a=='rng')rng=+el.value;
else if(a=='q')q=el.value.trim();
else if(a=='qgo')q=($('#sq')?.value||'').trim();
else if(a=='qclr')q='';
else if(a=='gocat'){cat=v;view='browse'}
else if(a=='goto'){setTimeout(()=>document.getElementById(v)?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}),30)}
else if(a=='no'){ord=null;of=false}
else if(a=='orderform'){of=true;setTimeout(()=>$('#ordp')?.scrollIntoView({block:'nearest'}),50)}
else if(a=='orderback')of=false;
else if(a=='desc')await updateDoc(doc(db,'products',v),{desc:el.value.trim().slice(0,300)});
else if(a=='go'){const n=$('#bn').value.trim(),sp=$('#bs').value.trim(),p=D_('products',ord);dr={n:$('#bn').value,sp:$('#bs').value,w:$('#bw').value,q:$('#bq').value};
const w=num($('#bw').value),q=Math.max(1,Math.min(10,parseInt($('#bq').value)||1));
if(gone(p))msg='Sorry, this item is sold out.';
else if(!n||!sp||w.length<8||w.length>15)msg='Please type your first name, delivery spot and WhatsApp number (with country code).';
else if(tr(p)&&!p.sold&&q>p.stock)msg='Only '+p.stock+' left. Please choose a smaller quantity.';
else{const pre=so(p),b=writeBatch(db);b.set(doc(collection(db,'orders')),{pid:p.id,sid:p.sid,pname:p.name,buyer:U.uid,name:n,spot:sp,at:Date.now(),st:pre?'Scheduled':'Placed',why:'',bw:w,qty:q,price:p.price,paid:false,stk:tr(p)&&!pre});
if(tr(p)&&!pre)b.update(doc(db,'products',p.id),{stock:increment(-q)});await b.commit();await updateDoc(doc(db,'users',U.uid),{wa:w}).catch(()=>{});
msg=`Order sent, thank you ${esc(n)}. <a href="https://wa.me/${num(D_('sellers',p.sid)?.wa)}?text=${encodeURIComponent('Hi, I just ordered '+p.name+' on Campus Market. - '+n)}" target="_blank" rel="noopener">Open WhatsApp to message the seller</a>`;ord=null;of=false}}
else if(a=='cx'){const o=D.mine.find(x=>x.id==v),p=D_('products',o.pid),b=writeBatch(db);b.update(doc(db,'orders',v),{st:'Cancelled',why:$('#r'+v).value,stk:false});if(o.stk&&p&&tr(p))b.update(doc(db,'products',p.id),{stock:increment(oq(o))});await b.commit();aud('Order cancelled by buyer',o.name+' - '+o.pname)}
else if(a=='apply'){const n=$('#sb').value.trim(),w=num($('#sw').value);ap={n:$('#sb').value,k:$('#sk').value,w:$('#sw').value};if(!n||w.length<8||w.length>15)err='Please type a name and a WhatsApp number with country code.';else await addDoc(collection(db,'sellers'),{name:n,owner:U.uid,ok:false,kind:$('#sk').value,wa:w})}
else if(['acc','dec','pen','com'].includes(a)){const o=D_('orders',v),st={acc:'Accepted',dec:'Declined',pen:'Pending',com:'Completed'}[a],b=writeBatch(db),u={st};
if(a=='dec'&&o.stk){u.stk=false;const p=D_('products',o.pid);if(p&&tr(p))b.update(doc(db,'products',p.id),{stock:increment(oq(o))})}
b.update(doc(db,'orders',v),u);await b.commit();aud('Order '+st.toLowerCase(),o.name+' - '+o.pname)}
else if(a=='paid'){const o=D_('orders',v);if(!o.paid){await updateDoc(doc(db,'orders',v),{paid:true,paidAt:Date.now()});aud('Marked paid',o.name+' - '+o.pname)}}
else if(a=='unpay'){const o=D_('orders',v);await updateDoc(doc(db,'orders',v),{paid:false,paidAt:null});aud('Undid paid (admin)',o.name+' - '+o.pname)}
else if(a=='setstock'){const t=el.value.trim(),n=t===''?null:Math.max(0,parseInt(t)||0),p=D_('products',v),b=writeBatch(db);b.update(doc(db,'products',v),{stock:n});
if(n>0&&tr(p)&&p.stock<=0)D.orders.filter(o=>o.pid==v&&o.st=='Scheduled').forEach(o=>b.update(doc(db,'orders',o.id),{st:'Placed',at:Date.now()}));await b.commit()}
else if(a=='rcpt'){const o=[...D.orders,...D.mine].find(x=>x.id==v);if(o&&o.paid&&!['Cancelled','Declined'].includes(o.st))rcId=v;else err='A receipt is only available after the seller confirms payment.'}

else if(a=='savewa'){const w=num($('#mw').value);if(w.length<8||w.length>15)err='Please type a WhatsApp number with country code.';else await updateDoc(doc(db,'sellers',P.sid),{wa:w})}
else if(a=='pic'){const f=el.files[0];if(f)await updateDoc(doc(db,'products',v),{img:await shrink(f)})}
else if(a=='appr'){const s=D_('sellers',v),b=writeBatch(db);b.update(doc(db,'sellers',v),{ok:true,okAt:Date.now()});b.update(doc(db,'users',s.owner),{role:'seller',sid:v});await b.commit();aud('Approved seller',s.name)}

}catch(e){err=nice(e);console.error(e)}
render()}
